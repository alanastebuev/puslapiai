<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100vw" height="100vh">
	<title>Neaiškus varnos dydžio paukštis</title>
	<foreignObject width="20ch" height="100vh" id="leftside">
		<nav xmlns="http://www.w3.org/1999/xhtml" style="overflow:auto;position:absolute;inset:0"><ul>
			<li><a href="neįdomus-puslapis.svg">Neįdomus puslapis</a></li>
			<li>Neaiškus varnos dydžio paukštis</li>
		</ul></nav>
	</foreignObject>
	<foreignObject width="calc(100vw - (8px + 20ch))" height="100vh" x="calc(8px + 20ch)" id="rightside">
		<main xmlns="http://www.w3.org/1999/xhtml" style="overflow:auto;position:absolute;inset:0;padding-left:1ch">
			<h1>Neaiškus varnos dydžio paukštis</h1>
			<p><a style="display:block;width:max-content" href="dideli-pavekslėliai/neaiškus-varnos-dydžio-paukštis.jpg"><img style="display:block" src="maži-pavekslėliai/neaiškus-varnos-dydžio-paukštis.webp" width="480" height="270"/></a></p>
			<p>… pastebėtas Kaune 2023-11-26 15:16.</p>
			<p>Juodos linijos nuotraukoje yra žiūrono per kurį fotografuota viduje.</p>
			<p>Paukštis keistas tuo, kad apatinė snapo dalis yra trumpesnė už viršutinę:<img style="display:block" src="maži-pavekslėliai/snapas.webp" width="240" height="176"/></p>
			<form action="http://127.0.0.1:1111" method="post">
				<fieldset style="display:grid;max-width:max-content">
					<legend>Gal žinai kokia tai rūšis?</legend>
					<textarea name="txt" placeholder="tekstas kurį skaitys saito savininkas" rows="6" cols="40" required=""/>
					<input type="submit" value="siųsti"/>
				</fieldset>
			</form>
		</main>
	</foreignObject>

	<rect width="8px" height="100vh" x="20ch" id="splitclose" fill="grey"/>
	<rect width="8px" height="100vh" id="splitopen" display="none" fill="grey"/>

	<set href="#leftside" begin="splitclose.click" end="splitopen.click" attributeName="display" to="none"/>
	<set href="#rightside" begin="splitclose.click" end="splitopen.click" attributeName="class" to="rightsidebig"/><style>.rightsidebig{width:calc(100vw - 8px);x:8px;}</style>
	<set href="#splitclose" begin="splitclose.click" end="splitopen.click" attributeName="display" to="none"/>
	<set href="#splitopen" begin="splitclose.click" end="splitopen.click" attributeName="display" to="block"/>
</svg>